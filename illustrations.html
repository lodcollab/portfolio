<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Illustrations — Elodie Hu</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #111111;
      --gray-client: #D9D9D9;
      --white: #ffffff;
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --nav-h: 80px;
      --pad: 48px;
    }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px var(--pad);
    }

    .nav-logo {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--black);
    }

    .nav-links { display: flex; gap: 58px; list-style: none; }

    .nav-links a {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--black);
      text-transform: uppercase;
      position: relative;
      padding-bottom: 2px;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--black);
      transition: width 0.25s ease;
    }
    .nav-links a:hover::after { width: 100%; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--black);
      transition: all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--white);
      z-index: 99;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-size: 32px;
      font-weight: 700;
      text-decoration: none;
      color: var(--black);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ══════════════════════════════════════
       TITRE FIXE
       Immobile au centre pendant tout le
       défilement. Les médias passent devant.
    ══════════════════════════════════════ */
    .illu-title {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }

    .illu-title h1 {
      font-size: clamp(32px, 5.6vw, 110px);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      line-height: 1;
    }

    /* ══════════════════════════════════════
       MÉDIAS
       Chaque bloc se place avec deux valeurs :
         --x  décalage depuis la gauche
         --w  largeur
         --mb blanc sous le bloc (optionnel)
       Toutes en % de la largeur de page.
    ══════════════════════════════════════ */
    /* Zone des médias : chaque visuel est posé en absolu d'après la maquette.
       --x et --w sont des % de la largeur de page, --y une distance en vw
       depuis le premier visuel. Tout reste donc proportionnel à l'écran. */
    .illu-flow {
      position: relative;
      z-index: 2;
      margin-top: 100vh;
      height: 742.0vw;
    }

    .illu-item {
      position: absolute;
      left: var(--x, 0%);
      top: var(--y, 0vw);
      width: var(--w, 45%);
    }

    .illu-item img,
    .illu-item video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Le bas de page couvre le titre : la page se termine proprement */
    .illu-end {
      position: relative;
      z-index: 3;
      background: var(--white);
      padding-top: 30vh;
    }

    /* ══════════════════════════════════════
       SECTION AUTRES PROJETS
    ══════════════════════════════════════ */
    .more-divider {
      height: 1px;
      background: var(--black);
      margin: 0 var(--pad);
    }

    .more-section { padding: 48px var(--pad) 80px; }

    .more-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 24px;
    }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .more-card { text-decoration: none; color: inherit; display: block; cursor: pointer; }

    .more-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--gray-client);
      overflow: hidden;
      position: relative;
    }

    .more-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease;
    }

    .more-thumb .hover-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      opacity: 0;
      transition: opacity 0.3s ease, background 0.3s ease;
    }

    .more-thumb .hover-label span {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .more-card:hover .more-thumb img { filter: brightness(0.4); }
    .more-card:hover .more-thumb .hover-label {
      opacity: 1;
      background: rgba(0,0,0,0.3);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      :root { --pad: 32px; }
      nav { padding: 24px var(--pad); }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .more-grid { grid-template-columns: repeat(2, 1fr); }
      /* Sur mobile, retour au flux normal : pleine largeur, empilé */
      .illu-flow { height: auto; margin-top: 85vh; padding: 0 var(--pad); }
      .illu-item {
        position: static;
        width: 100%;
        margin: 0 0 14vh;
      }
    }

    @media (max-width: 540px) {
      :root { --pad: 20px; }
      .more-grid { grid-template-columns: 1fr; }
      .more-section { padding: 48px var(--pad) 48px; }
    }
  </style>
</head>
<body>

  <script>
    // 3 projets tirés au hasard, jamais la page courante, jamais de doublon.
    (function () {
      var P = [
        {h:"titlesequence.html", i:"tampopo_cover.webp", n:"Title sequence - Tampopo"},
        {h:"orsay.html", i:"orsay-still-2.webp", n:"L'aventure impressionniste - Musée d'Orsay"},
        {h:"pmu_contenus_digitaux.html", i:"pmuplay_cover.webp", n:"PMUPLAY® - contenus digitaux"},
        {h:"sdes.html", i:"sdes_cover.webp", n:"4 grands défis pour demain - SDES"},
        {h:"mugler.html", i:"mugler_cover.webp", n:"Les Exceptions — Mugler"},
        {h:"humanappeal.html", i:"humanappeal-cover.webp", n:"Orphelins et enfants en contexte de crise - Human Appeal"},
        {h:"illustrations.html", i:"illustrations_cover.webp", n:"Illustrations"},
        {h:"clubmed.html", i:"qapsule_cover.webp", n:"ClubMED® - PMU®"},
        {h:"insee.html", i:"insee_cover.webp", n:"L'essentiel du PIB - INSEE"},
        {h:"cdd.html", i:"cdd_cover.webp", n:"Série de vidéo - Caisse des Dépôts"},
        {h:"infographies.html", i:"infographies_cover.webp", n:"Infographie - Les Echos, Datagora ..."},
        {h:"artisanat.html", i:"artisanat-5.webp", n:"Artisanats chinois"},
        {h:"aznavour.html", i:"aznavour_cover.webp", n:"Charles Aznavour - Universal Music France"}
      ];
      var ici = location.pathname.split('/').pop() || 'index.html';
      var pool = P.filter(function (p) { return p.h !== ici; });

      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      }

      document.getElementById('moreGrid').innerHTML = pool.slice(0, 3).map(function (p) {
        return '<a class="more-card" href="' + p.h + '">'
             +   '<div class="more-thumb">'
             +     '<img src="images/' + p.i + '" alt="" loading="lazy" />'
             +     '<div class="hover-label"><span>' + p.n + '</span></div>'
             +   '</div>'
             + '</a>';
      }).join('');
    })();

    function toggleMobile() {
      document.getElementById('mobileMenu').classList.toggle('open');
      document.getElementById('hamburger').classList.toggle('open');
    }
    function closeMobile() {
      document.getElementById('mobileMenu').classList.remove('open');
      document.getElementById('hamburger').classList.remove('open');
    }
  </script>
